  <line x1="0" y1="120" x2="1200" y2="120" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#2a2a2a" stroke-width="1"/>

  <text x="80" y="155"
        font-family="'SF Mono', 'JetBrains Mono', monospace"
