  </text>

  <text x="600" y="310" text-anchor="middle"
        font-family="-apple-system, 'SF Pro Text', system-ui"
        font-size="20" font-weight="500" fill="#ffffff" fill-opacity="0.85" letter-spacing="1">
    Machine Learning  ·  Deep Learning  ·  AI Engineering
  </text>

  <line x1="540" y1="370" x2="660" y2="370" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>

  <text x="600" y="405" text-anchor="middle"
        font-family="-apple-system, 'SF Pro Text', system-ui"
        font-size="14" font-weight="400" fill="#ffffff" fill-opacity="0.6" letter-spacing="3">
    PORTFOLIO  ·  2026
