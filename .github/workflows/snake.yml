name: Generate contribution snake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#9a7b1c&color_dots=#ebedf0,#d5d9de,#a3aab3,#d4a62a,#9a7b1c
            dist/snake-dark.svg?palette=github-dark&color_snake=#f5d77a&color_dots=#161b22,#30363d,#8b949e,#c9a84c,#f2cc60

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
